name: Build Elgmmal-store APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir -p extracted
          find . -maxdepth 1 -name "*.zip" -exec unzip -oq {} -d extracted \;
          find extracted -type f -name "*.zip" -exec sh -c 'unzip -oq "$1" -d extracted/source' _ {} \;

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts | head -n 1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elgmmal-store-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
